name: NovelGraph tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/world-state-step5]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Graphify compatibility dependency
        run: python -m pip install graphifyy==0.9.102
      - name: Run full synthetic test suite
        run: python -m unittest discover -s tests -v
